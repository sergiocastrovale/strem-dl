# One build, shared by "Build Linux", "Build Windows" and "Build macOS". Not run by itself.
# Attaches the packages to the release that "Release" prepared for this commit.
name: Build (shared)

on:
  workflow_call:
    inputs:
      name:
        description: What this build is, for its title
        type: string
        required: true
      runner:
        type: string
        required: true
      target:
        description: Rust target to add. Empty builds for the runner itself.
        type: string
        default: ''
      args:
        description: Extra arguments for `tauri build`
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.4'
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
    gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the release to add to
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$app"
          if ! info=$(gh release view "$tag" --json databaseId,isDraft,targetCommitish --jq '[.databaseId, .isDraft, .targetCommitish] | @tsv' 2>/dev/null); then
            echo "::error::There's no release $tag yet. Run the Release workflow first, from this same commit."
            exit 1
          fi
          read -r id is_draft target <<< "$info"
          if [ "$is_draft" = true ]; then
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Draft $tag was prepared from $target, but this build is from $GITHUB_SHA. Run Release again from this commit, so every OS ships the same code."
              exit 1
            fi
          else
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is already published from $tagged. Run this from that tag, or raise the version."
              exit 1
            fi
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ inputs.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ inputs.target }}
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # One package per word.
          sudo apt-get install -y $LINUX_PACKAGES
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          tauriScript: pnpm tauri
          args: ${{ inputs.args }}
